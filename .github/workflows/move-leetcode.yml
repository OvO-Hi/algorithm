name: Organize LeetCode Solutions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move LeetCode problems
        shell: bash
        run: |
          mkdir -p LeetCode

          shopt -s nullglob

          for dir in [0-9][0-9][0-9][0-9]-*/; do
            problem="${dir%/}"

            echo "Moving $problem to LeetCode/$problem"

            mkdir -p "LeetCode/$problem"

            cp -a "$problem/." "LeetCode/$problem/"
            rm -rf "$problem"
          done

      - name: Commit organized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No LeetCode problems to organize."
            exit 0
          fi

          git commit -m "chore: organize LeetCode solutions"
          git push
